name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test:
    # The label the git-runner fleet advertises. A label nothing advertises
    # queues to the timeout instead of failing, which reports nothing at all.
    runs-on: [hanzo-build-linux-amd64]
    steps:
      - uses: actions/checkout@v4

      # go.mod is the one place the version lives; `stable` can resolve below
      # the directive, and the build then fails on the toolchain, not the code.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -v ./...
